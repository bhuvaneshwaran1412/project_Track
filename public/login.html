<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Project Management</title>
  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="auth-wrapper">
    <div class="auth-split-card">
      
      <!-- Left Visual Panel (Matching Reference Image) -->
      <section class="auth-visual-panel" aria-label="Project Management Platform Highlights">
        <div class="auth-visual-header">
          <div class="auth-badge-icon" title="ProjectHub">
            <!-- Brain / Node Spark Icon -->
            <svg viewBox="0 0 24 24">
              <path d="M12 2a4 4 0 0 0-4 4v1.1A4.5 4.5 0 0 0 4 11.5c0 1.9 1.1 3.5 2.7 4.1A4.5 4.5 0 0 0 11 20v1a1 1 0 0 0 2 0v-1a4.5 4.5 0 0 0 4.3-4.4c1.6-.6 2.7-2.2 2.7-4.1a4.5 4.5 0 0 0-4-4.4V6a4 4 0 0 0-4-4zm-2 4a2 2 0 1 1 4 0v1h-4V6zm-3.5 6a2.5 2.5 0 0 1 2.5-2.5h1V15h-1a2.5 2.5 0 0 1-2.5-2.5zm11 0a2.5 2.5 0 0 1-2.5 2.5h-1V9.5h1a2.5 2.5 0 0 1 2.5 2.5z"/>
            </svg>
          </div>
        </div>

        <div class="auth-visual-content">
          <img 
            src="images/auth-illustration.svg" 
            alt="Coder turning ideas into reality" 
            class="auth-illustration-img"
          >
        </div>

        <div class="auth-visual-footer">
          <h2 class="auth-visual-headline">Turn your ideas into reality.</h2>
          <p class="auth-visual-subtitle">
            Manage academic projects, run agile sprints, and track milestones with your team.
          </p>
        </div>
      </section>

      <!-- Right Form Panel -->
      <section class="auth-form-panel" aria-label="Sign In Form">
        <div class="text-center">
          <div class="auth-brand-mark">
            <img src="images/logo.svg" alt="ProjectHub Logo" width="46" height="46">
          </div>
          <h1 class="auth-heading">Login to your Account</h1>
          <p class="auth-subheading">See what is going on with your projects</p>
        </div>

        <div id="formMessage"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="name.s2024@vitstudent.ac.in"
              autocomplete="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="password-toggle-wrapper">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="••••••••••••"
                autocomplete="current-password"
                required
              >
              <button 
                type="button" 
                id="togglePasswordBtn" 
                class="password-toggle-btn" 
                aria-label="Toggle password visibility"
              >
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox">
              <input type="checkbox" id="rememberMe">
              <span>Remember Me</span>
            </label>
            <a 
              href="#" 
              class="auth-forgot-link" 
              onclick="alert('Please contact your platform admin or project supervisor to reset your account password.'); return false;"
            >
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="btn-auth-primary">
            Login
          </button>
        </form>

        <p class="auth-switch-text">
          Not Registered Yet?
          <a href="register.html" class="auth-switch-link">Create an account</a>
        </p>

        <a href="index.html" class="auth-back-link">
          ← Back to home
        </a>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Password visibility toggle handler
    const toggleBtn = document.getElementById("togglePasswordBtn");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        
        if (isPassword) {
          // Eye off icon
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          `;
        } else {
          // Standard eye icon
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          `;
        }
      });
    }
  </script>
</body>
</html>
