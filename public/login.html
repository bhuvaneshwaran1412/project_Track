<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Project Management</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card auth-card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h1 class="h3 fw-bold text-primary">Student Project Management</h1>
              <p class="text-secondary mb-0">Sign in to continue</p>
            </div>

            <div id="formMessage"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="name.s2024@vitstudent.ac.in"
                  required
                >
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter your password"
                  required
                >
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                Login
              </button>
            </form>

            <p class="text-center text-secondary mt-4 mb-0">
              New student?
              <a href="register.html" class="text-decoration-none fw-semibold">
                Create an account
              </a>
            </p>

            <p class="text-center mt-3 mb-0">
              <a href="index.html" class="small text-decoration-none">
                ← Back to home
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
