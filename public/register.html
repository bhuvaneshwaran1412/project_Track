<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Student Project Management</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="auth-wrapper" style="max-width: 1080px;">
    <div class="auth-split-card">
      
      <!-- Left Visual Panel -->
      <section class="auth-visual-panel" aria-label="Student Registration Highlights">
        <div class="auth-visual-header">
          <div class="auth-badge-icon" title="ProjectHub">
            <svg viewBox="0 0 24 24">
              <path d="M12 2a4 4 0 0 0-4 4v1.1A4.5 4.5 0 0 0 4 11.5c0 1.9 1.1 3.5 2.7 4.1A4.5 4.5 0 0 0 11 20v1a1 1 0 0 0 2 0v-1a4.5 4.5 0 0 0 4.3-4.4c1.6-.6 2.7-2.2 2.7-4.1a4.5 4.5 0 0 0-4-4.4V6a4 4 0 0 0-4-4zm-2 4a2 2 0 1 1 4 0v1h-4V6zm-3.5 6a2.5 2.5 0 0 1 2.5-2.5h1V15h-1a2.5 2.5 0 0 1-2.5-2.5zm11 0a2.5 2.5 0 0 1-2.5 2.5h-1V9.5h1a2.5 2.5 0 0 1 2.5 2.5z"/>
            </svg>
          </div>
        </div>

        <div class="auth-visual-content">
          <img 
            src="images/register-illustration.svg" 
            alt="Collaborative student agile team" 
            class="auth-illustration-img"
          >
        </div>

        <div class="auth-visual-footer">
          <h2 class="auth-visual-headline">Build squads. Ship on time.</h2>
          <p class="auth-visual-subtitle">
            Join thousands of student engineers running agile sprints and acing project reviews.
          </p>
        </div>
      </section>

      <!-- Right Form Panel -->
      <section class="auth-form-panel" style="padding: 40px 38px;" aria-label="Student Sign Up Form">
        <div class="text-center mb-3">
          <div class="auth-brand-mark">
            <img src="images/logo.svg" alt="ProjectHub Logo" width="42" height="42">
          </div>
          <h1 class="auth-heading" style="font-size: 1.6rem;">Create Student Account</h1>
          <p class="auth-subheading mb-3">Join your academic project workspace</p>
        </div>

        <div id="formMessage"></div>

        <form id="registerForm" novalidate>
          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label for="fullName" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="fullName"
                name="fullName"
                placeholder="Alex Morgan"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="registrationNumber" class="form-label">Registration No.</label>
              <input 
                type="text"
                class="form-control"
                id="registrationNumber"
                name="registrationNumber"
                placeholder="24MIS0167"
                pattern="[0-9]{2}[A-Za-z]{3}[0-9]{4}"
                title="Format: e.g. 24MIS0167"
                required
              >
            </div>
          </div>

          <div class="mb-2">
            <label for="email" class="form-label">College Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="alex.m2024@vitstudent.ac.in"
              required
            >
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label for="department" class="form-label">Department</label>
              <select class="form-select" id="department" name="department" required>
                <option value="" selected disabled>Select department</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics and Comm. Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="CE">Civil Engineering</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="year" class="form-label">Year of Study</label>
              <select class="form-select" id="year" name="year" required>
                <option value="" selected disabled>Select year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
                <option value="5">Fifth Year</option>
              </select>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Min 6 chars"
                minlength="6"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repeat password"
                minlength="6"
                required
              >
            </div>
          </div>

          <button type="submit" class="btn-auth-primary">
            Create Account
          </button>
        </form>

        <p class="auth-switch-text mt-3">
          Already have an account?
          <a href="login.html" class="auth-switch-link">Login</a>
        </p>

        <a href="index.html" class="auth-back-link">
          ← Back to home
        </a>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
