<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Student Project Management</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="card auth-card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h1 class="h3 fw-bold text-primary mb-2">Create Student Account</h1>
              <p class="text-secondary mb-0">
                Join the Student Project Management Platform
              </p>
            </div>

            <div id="formMessage"></div>

            <form id="registerForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                  >
                </div>

            <div class="col-md-6">
              <label for="registrationNumber" class="form-label">Registration Number</label>
              <input type="text"
                     class="form-control"
                     id="registrationNumber"
                     name="registrationNumber"
                     placeholder="Example: 24MIS0167"
                     pattern="[0-9]{2}[A-Za-z]{3}[0-9]{4}"
                    title="Use VIT format, for example: 24MIS0167"
                    required
               >
</div>

                <div class="col-12">
                  <label for="email" class="form-label">College Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="name@vitstudent.ac.in"
                    required
                  >
                </div>

                <div class="col-md-6">
                  <label for="department" class="form-label">Department</label>
                  <select class="form-select" id="department" name="department" required>
                    <option value="" selected disabled>Select department</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics and Communication Engineering</option>
                    <option value="EEE">Electrical and Electronics Engineering</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="year" class="form-label">Year of Study</label>
                  <select class="form-select" id="year" name="year" required>
                    <option value="" selected disabled>Select year</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                    <option value="5">Fifth Year</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                  >
                </div>

                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                  >
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100 py-2">
                    Create Account
                  </button>
                </div>
              </div>
            </form>

            <p class="text-center text-secondary mt-4 mb-0">
              Already have an account?
              <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
            </p>

            <p class="text-center mt-3 mb-0">
              <a href="index.html" class="small text-decoration-none">
                ← Back to home
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
