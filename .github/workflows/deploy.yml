name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS Connection
        run: |
          python -c "import boto3, os; [os.environ.update({k: v.strip()}) for k, v in os.environ.items() if 'AWS' in k]; sts = boto3.client('sts', region_name='ap-southeast-2'); print('SUCCESS: Connected to AWS as', sts.get_caller_identity()['Arn'])"

      - name: Deploy Infrastructure and App
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python -u infra/deploy.py --db-password "${DB_PASSWORD:-AdminPass123!}" 2>&1 | tee deploy_output.log

      - name: Show Deploy Output
        if: always()
        run: |
          echo "### Deployment Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy_output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Initialize Database
        continue-on-error: true
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-client || true
          for i in {1..3}; do
            mysql -h "$DB_HOST" -u admin -p"$DB_PASSWORD" projecttrack < backup.sql && break || sleep 10
          done
