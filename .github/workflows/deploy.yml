name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy Infrastructure and App
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python infra/deploy.py --db-password "$DB_PASSWORD"

      - name: Initialize Database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          # We retry a few times because DB might still be initializing connections
          for i in {1..5}; do
            mysql -h "$DB_HOST" -u admin -p"$DB_PASSWORD" projecttrack < backup.sql && break || sleep 15
          done
